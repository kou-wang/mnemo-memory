name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mnemo_test
          POSTGRES_USER: mnemo
          POSTGRES_PASSWORD: mnemo_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnemo -d mnemo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MNEMO_TEST_DATABASE_URL: postgresql+psycopg://mnemo:mnemo_test_password@127.0.0.1:5432/mnemo_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Unit tests with coverage
        run: pytest -m "not postgres" --cov=mnemo --cov-report=term-missing

      - name: PostgreSQL integration tests
        run: pytest -m postgres --cov=mnemo --cov-append --cov-report=term-missing

      - name: Enforce lifecycle coverage
        run: coverage report --include="*/mnemo/lifecycle/*" --fail-under=90
